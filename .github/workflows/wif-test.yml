name: WIF Handson

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v3
        with:
          project_id: iam-test-512213
          workload_identity_provider: projects/867496761966/locations/global/workloadIdentityPools/github-handson/providers/github-oidc

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify IAM permissions
        run: |
          gcloud projects describe \
            "$CLOUDSDK_CORE_PROJECT" \
            --format="table(projectId,projectNumber,name)"
